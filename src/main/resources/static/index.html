
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCart — Fitness Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">

      <a href="/" class="brand">
        ⚡ FitCart <span>Fitness</span>
      </a>

      <!-- Authenticated Account Information -->
      <div class="account-info">
        <div>
          <strong id="currentUserName">Loading...</strong>
          <div id="currentUserEmail"
               style="font-size:0.8rem;color:var(--text-muted)">
          </div>
        </div>

        <span id="currentUserRole" class="badge">...</span>

        <button class="btn btn-secondary" onclick="logout()">
          Log Out
        </button>
      </div>

      <!-- Buyer Shopping Actions -->
      <div class="nav-actions">
        <button class="btn btn-secondary" onclick="openWishlistModal()">
          ♥ Wishlist
          <span id="wishlistCount" class="badge">0</span>
        </button>

        <button class="btn btn-primary" onclick="openCartModal()">
          🛒 Cart
          <span id="cartCount" class="badge">0</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Navigation Tabs: Rendered by app.js according to the logged-in role -->
  <div class="tabs" id="roleTabs"></div>

  <!-- Main Dashboard Content -->
  <main id="mainContent">
    <p>Loading FitCart...</p>
  </main>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2>Your Shopping Cart</h2>
        <button class="modal-close" onclick="closeCartModal()">
          &times;
        </button>
      </div>

      <div id="cartItemsList"></div>

      <div id="cartSummary"
           style="margin-top:1.5rem;text-align:right;border-top:1px solid var(--border);padding-top:1rem">

        <h3>Total: ₹<span id="cartTotal">0.00</span></h3>

        <div style="margin-top:1rem;display:flex;justify-content:flex-end;gap:1rem">
          <button class="btn btn-secondary" onclick="clearUserCart()">
            Clear Cart
          </button>

          <button class="btn btn-primary" onclick="openCheckoutModal()">
            Proceed to Checkout
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Wishlist Modal -->
  <div class="modal" id="wishlistModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2>Your Wishlist</h2>
        <button class="modal-close" onclick="closeWishlistModal()">
          &times;
        </button>
      </div>

      <div id="wishlistItemsList"></div>

    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2>Checkout &amp; Demonstration Payment</h2>
        <button class="modal-close" onclick="closeCheckoutModal()">
          &times;
        </button>
      </div>

      <div class="form-group">
        <label for="checkoutPaymentMethod">
          Payment Method (Simulated)
        </label>

        <select id="checkoutPaymentMethod" class="form-control">
          <option value="CARD">Credit / Debit Card (Demo)</option>
          <option value="UPI">UPI / Instant Transfer (Demo)</option>
          <option value="COD">Cash on Delivery (Demo)</option>
        </select>

        <p style="font-size:0.75rem;color:var(--accent);margin-top:0.3rem">
          Real payments are disabled. Orders use simulated demo transactions.
        </p>
      </div>

      <div style="margin-top:1.5rem;display:flex;justify-content:flex-end;gap:1rem">
        <button class="btn btn-secondary" onclick="closeCheckoutModal()">
          Cancel
        </button>

        <button class="btn btn-primary" onclick="confirmOrderCheckout()">
          Confirm Order
        </button>
      </div>

    </div>
  </div>

  <!-- Notification Toast -->
  <div id="notification">Notification message</div>

  <!-- Main JavaScript -->
  <script src="app.js"></script>

</body>
</html>
